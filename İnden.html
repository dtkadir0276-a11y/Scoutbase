<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScoutBase</title><style>body{margin:0;background:#0b1423;color:white;font-family:Arial,sans-serif;padding:22px}header{display:flex;justify-content:space-between;align-items:center}h1{color:#59e6b0}input,select{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border:1px solid #34465e;border-radius:12px;background:#19283c;color:white}.card{background:#19283c;border-radius:16px;padding:18px;margin:12px 0}.tag{color:#59e6b0;font-size:13px}small{color:#aab7c9}button{padding:12px;background:#59e6b0;border:0;border-radius:10px;font-weight:bold}</style></head><body><header><h1>⚽ ScoutBase</h1><span>SKAUT PRO</span></header><p>Dünya futbolunu keşfet</p><input id="search" placeholder="Oyuncu ara..." oninput="render()"><select id="position" onchange="render()"><option value="">Tüm pozisyonlar</option><option>ST</option><option>CB</option><option>CM</option><option>LW</option></select><h2>Oyuncu keşfi</h2><div id="results"></div><p><small>Demo sürümüdür. Canlı futbolcu verileri henüz bağlı değildir.</small></p><script>const players=[{name:"Örnek Forvet",age:21,pos:"ST",club:"Demo FC",score:84},{name:"Örnek Stoper",age:19,pos:"CB",club:"Scout United",score:81},{name:"Örnek Orta Saha",age:23,pos:"CM",club:"Demo FC",score:87},{name:"Örnek Kanat",age:20,pos:"LW",club:"Scout United",score:85}];function render(){const q=document.getElementById("search").value.toLocaleLowerCase("tr");const p=document.getElementById("position").value;document.getElementById("results").innerHTML=players.filter(x=>x.name.toLocaleLowerCase("tr").includes(q)&&(!p||x.pos===p)).map(x=>`<div class="card"><span class="tag">${x.pos} · ${x.age} yaş</span><h3>${x.name}</h3><p>${x.club}</p><strong>Demo puanı: ${x.score}</strong></div>`).join("")||"<p>Oyuncu bulunamadı.</p>"}render();</script></body></html>
